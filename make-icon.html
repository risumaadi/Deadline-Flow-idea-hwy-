<!DOCTYPE html>
<html>
<head><title>Make Icon</title></head>
<body style="background:#111;color:white;text-align:center;padding:40px;font-family:sans-serif">
<h2>⚡ Deadline Flow Icon Generator</h2>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<br><br>

<img id="preview" style="border-radius:20px;margin:20px"><br>

<button onclick="make(192)" style="padding:14px 24px;background:#7C5CFC;color:white;border:none;border-radius:12px;font-size:16px;cursor:pointer;margin:8px">
  ⬇️ Download icon-192.png
</button>
<br>
<button onclick="make(512)" style="padding:14px 24px;background:#38BDF8;color:white;border:none;border-radius:12px;font-size:16px;cursor:pointer;margin:8px">
  ⬇️ Download icon-512.png
</button>

<script>
function make(size) {
  const canvas = document.getElementById('c' + size);
  const ctx = canvas.getContext('2d');
  
  // Background
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#7C5CFC');
  grad.addColorStop(1, '#38BDF8');
  ctx.fillStyle = grad;
  
  // Rounded rect
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size-r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size-r);
  ctx.quadraticCurveTo(size, size, size-r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();
  
  // Lightning bolt
  ctx.fillStyle = '#FFD700';
  const s = size;
  ctx.beginPath();
  ctx.moveTo(s*0.58, s*0.08);
  ctx.lineTo(s*0.28, s*0.52);
  ctx.lineTo(s*0.48, s*0.52);
  ctx.lineTo(s*0.38, s*0.92);
  ctx.lineTo(s*0.72, s*0.45);
  ctx.lineTo(s*0.52, s*0.45);
  ctx.lineTo(s*0.72, s*0.08);
  ctx.closePath();
  ctx.fill();
  
  // Show preview
  document.getElementById('preview').src = canvas.toDataURL();
  document.getElementById('preview').width = 150;
  
  // Download
  const a = document.createElement('a');
  a.download = 'icon-' + size + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// Auto preview
window.onload = function() {
  const canvas = document.getElementById('c192');
  const ctx = canvas.getContext('2d');
  const size = 192;
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#7C5CFC');
  grad.addColorStop(1, '#38BDF8');
  ctx.fillStyle = grad;
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size-r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size-r);
  ctx.quadraticCurveTo(size, size, size-r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.moveTo(size*0.58, size*0.08);
  ctx.lineTo(size*0.28, size*0.52);
  ctx.lineTo(size*0.48, size*0.52);
  ctx.lineTo(size*0.38, size*0.92);
  ctx.lineTo(size*0.72, size*0.45);
  ctx.lineTo(size*0.52, size*0.45);
  ctx.lineTo(size*0.72, size*0.08);
  ctx.closePath();
  ctx.fill();
  document.getElementById('preview').src = canvas.toDataURL();
  document.getElementById('preview').width = 150;
};
</script>
</body>
</html>
